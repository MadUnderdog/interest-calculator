<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>คำนวณดอกเบี้ย รถยนต์ & บ้าน</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p1:#fce4ec;--p2:#f3e5f5;--p3:#e8eaf6;--p4:#e0f7fa;--p5:#fff3e0;--accent:#ab47bc;--accent2:#5c6bc0;--text:#333;--muted:#666;--card:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);--r:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--p1),var(--p2),var(--p3));min-height:100vh;color:var(--text);padding:0}
.container{max-width:1100px;margin:0 auto;padding:12px}

/* Layout */
.main-layout{display:flex;flex-direction:column;gap:12px;transition:all .5s ease}
@media(min-width:768px){
  .main-layout{flex-direction:row;align-items:flex-start;justify-content:center}
  .main-layout.calculated{justify-content:flex-start}
  .form-panel{transition:all .5s ease;min-width:380px}
  .main-layout:not(.calculated) .form-panel{flex:0 0 420px;margin:0 auto}
  .main-layout.calculated .form-panel{flex:0 0 420px}
  .result-panel{flex:1;overflow-y:auto;opacity:0;transform:translateX(40px);transition:all .5s ease .15s;border-radius:var(--r)}
  .main-layout.calculated .result-panel{opacity:1;transform:translateX(0)}
}

h1{text-align:center;font-size:1.15rem;margin:8px 0 10px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Tab buttons */
.tabs{display:flex;gap:10px;margin-bottom:10px;justify-content:center;flex-wrap:wrap}
.tab-btn{padding:10px 28px;border-radius:var(--r);border:2px solid var(--accent2);background:var(--card);color:var(--muted);font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.tab-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(171,71,188,.3)}

/* Card */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}

/* Form */
.field{margin-bottom:10px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px;font-weight:500}
.field input,.field select{width:100%;padding:9px 10px;border:2px solid #e0e0e0;border-radius:8px;font-size:.95rem;transition:.2s;background:#fafafa}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;background:#fff}

/* Down payment - dual inputs */
.down-dual{display:flex;gap:8px}
.down-dual .field{margin-bottom:0;flex:1}
.down-dual .field label{font-size:.72rem}
.down-input{position:relative}
.down-input input{padding-right:24px}
.down-suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--muted);pointer-events:none;font-weight:600}
.down-arrow{display:flex;align-items:flex-end;padding-bottom:10px;font-size:1.2rem;color:var(--accent);flex-shrink:0}

/* Discount row */
.discount-row{display:flex;gap:6px;align-items:center}
.discount-row .field{flex:1;margin-bottom:0}
.discount-toggle-row{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;flex-shrink:0}
.discount-toggle-label{font-size:.75rem;color:var(--text);font-weight:500;white-space:nowrap}
.discount-status{font-size:.7rem;color:var(--accent);background:linear-gradient(135deg,var(--p4),var(--p3));padding:3px 8px;border-radius:4px;margin-top:4px;display:flex;align-items:center;gap:4px}
.discount-status::before{content:'↘'}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer;display:inline-block;vertical-align:middle}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#d0d0d0;border-radius:24px;transition:.3s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.toggle .slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle input:checked+.slider{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.toggle input:checked+.slider::before{transform:translateX(18px)}

/* Rate grid */
.rate-grid{display:flex;gap:6px}
.rate-item{flex:1;background:var(--p3);border-radius:8px;padding:6px 5px;text-align:center}
.rate-item label{font-size:.7rem;color:var(--accent2);font-weight:600;margin-bottom:1px;display:block}
.rate-item input[type="number"]{width:100%;padding:5px 4px;border:2px solid #e0e0e0;border-radius:6px;font-size:.82rem;background:#fafafa;text-align:center}
.rate-item input[type="number"]:focus{border-color:var(--accent);outline:none;background:#fff}
.rate-monthly{width:100%;padding:4px 2px;border:1.5px dashed #c5cae9;border-radius:5px;font-size:.75rem;background:#fff;text-align:center;color:var(--text);font-weight:400;margin-top:4px}
.rate-monthly:focus{border-color:var(--accent);outline:none;background:#f3e5f5}

/* Radio group */
.radio-group{display:flex;gap:0;border-radius:8px;overflow:hidden;border:2px solid #e0e0e0}
.radio-group label{flex:1;padding:8px 6px;text-align:center;cursor:pointer;font-size:.8rem;font-weight:500;background:#fafafa;color:var(--muted);transition:.2s;border-right:1px solid #e0e0e0}
.radio-group label:last-child{border-right:none}
.radio-group input{display:none}
.radio-group input:checked+span{color:var(--accent);font-weight:700}
.radio-group label:has(input:checked){background:linear-gradient(135deg,var(--p4),var(--p3));color:var(--accent2);font-weight:700}
.radio-group label:hover{background:var(--p3)}

/* Button */
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-calc{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:4px}
.btn-calc:active{transform:scale(.97)}
.btn-secondary{background:var(--p3);color:var(--accent2);margin-top:6px;font-size:.85rem;border:2px solid var(--accent2)}
.btn-secondary:hover{background:var(--p4)}
.btn-clear-h{background:#ef5350;color:#fff;margin-top:6px;font-size:.85rem}
.btn-row{display:flex;gap:6px;margin-top:6px}
.btn-row .btn{flex:1;font-size:.82rem;padding:9px 6px}
.btn-edit{background:linear-gradient(135deg,#ff9800,#f57c00);color:#fff;border:none;font-size:.78rem;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;margin-left:6px}
.btn-edit:active{transform:scale(.97)}

/* Result Panel */
.result-panel{display:none}
.result-panel.show{display:block}
.result-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.result-card h3{font-size:.95rem;color:var(--accent);margin-bottom:10px;text-align:center}

/* Result Table */
.result-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
.result-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:520px}
.result-table th{background:#f5f5f5;padding:7px 8px;text-align:center;font-weight:600;color:var(--text);border-bottom:2px solid #e0e0e0;white-space:nowrap}
.result-table td{padding:6px 8px;text-align:right;border-bottom:1px solid #e8e8e8}
.result-table td:first-child{text-align:left;font-weight:500}
.result-table tr:last-child td{font-weight:700;color:var(--muted);border-top:2px solid #e0e0e0;background:#f5f5f5;font-size:.78rem}
.result-table .best{background:rgba(76,175,80,.1) !important}
.result-table .best td:first-child::after{content:" ✅";font-size:.75rem}

/* Summary info */
.info{font-size:.8rem;color:var(--muted);line-height:1.6;margin-bottom:8px;text-align:center}

/* Amortization */
.amort-wrap{overflow:auto;border-radius:8px;border:1px solid #e0e0e0;-webkit-overflow-scrolling:touch}
.amort-table{width:100%;border-collapse:collapse;font-size:.78rem}
.amort-table th{background:#f5f5f5;padding:6px 7px;text-align:center;font-weight:600;color:var(--text);border-bottom:2px solid #e0e0e0;position:sticky;top:0;z-index:1}
.amort-table td{padding:5px 7px;text-align:right;border-bottom:1px solid #eee}
.amort-table td:first-child{text-align:center;font-weight:500}
.amort-table tr:nth-child(even) td{background:rgba(0,0,0,.02)}
.amort-table tr:hover td{background:rgba(0,0,0,.02)}
.amort-table .row-total td{font-weight:700;color:var(--text);border-top:2px solid #e0e0e0;background:#f5f5f5}
.scroll-hint{text-align:center;font-size:.75rem;color:var(--muted);margin-top:4px}

/* Home loan rate periods */
.rate-periods{display:flex;flex-direction:column;gap:4px}
.rate-period{display:flex;gap:4px;align-items:center;background:var(--p3);border-radius:6px;padding:4px 6px}
.rate-period select,.rate-period input{font-size:.75rem;padding:4px;border:1.5px solid #e0e0e0;border-radius:4px;background:#fff}
.rate-period select{flex:0 0 auto;width:auto}
.rate-period input[type="number"]{width:55px;text-align:center}
.rate-period .rp-type{flex:0 0 auto}
.rate-period .rp-val{flex:0 0 65px}
.rate-period .rp-del{background:none;border:none;color:#ef5350;cursor:pointer;font-size:.85rem;padding:2px 4px;flex-shrink:0}
.rate-period .rp-del:hover{background:rgba(239,83,80,.1);border-radius:4px}
.rate-period .rp-preview{font-size:.68rem;color:var(--accent);font-weight:500;min-width:50px;text-align:right}

/* History */
.history{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.toggle-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 0}
.toggle-h span{font-size:.85rem;font-weight:600;color:var(--muted)}
.toggle-h .arrow{transition:.3s;font-size:.7rem}
.toggle-h .arrow.open{transform:rotate(180deg)}
.history-item{background:var(--p5);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.8rem;cursor:pointer;transition:.15s;border:2px solid transparent}
.history-item:hover{border-color:var(--accent2);background:#fff3e0}
.history-item .hi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.history-item .hi-type{font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.history-item .hi-date{color:var(--muted);font-size:.75rem}
.history-item .hi-details{color:var(--text);line-height:1.4}
.history-item .hi-del{background:none;border:none;color:#ef5350;cursor:pointer;font-size:.85rem;padding:2px 6px;border-radius:4px;flex-shrink:0}
.history-item .hi-del:hover{background:rgba(239,83,80,.15)}
#history-list{max-height:320px;overflow-y:auto;scrollbar-width:thin}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:12px 0}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r);padding:20px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{font-size:1rem;color:var(--accent);margin-bottom:12px;text-align:center}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted)}
.modal-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.85rem}
.modal-item input[type="checkbox"]{width:auto;accent-color:var(--accent)}
.modal-item label{cursor:pointer;flex:1}
.modal-other{margin-top:8px}
.modal-other input{width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;font-size:.85rem}
.modal-btn{width:100%;padding:10px;margin-top:12px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:.9rem;font-weight:600;cursor:pointer}

/* Compare page */
.compare-page{display:none}
.compare-page.show{display:block}
.compare-select{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.compare-select h3{font-size:.9rem;color:var(--accent);margin-bottom:8px}
.compare-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:.82rem}
.compare-item input{width:auto;accent-color:var(--accent)}
.compare-result{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.compare-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.compare-header h3{font-size:.95rem;color:var(--accent);margin:0}
.compare-section{margin-bottom:12px;border:1px solid #e8e8e8;border-radius:8px;overflow:hidden}
.cs-title{font-size:.82rem;font-weight:700;padding:6px 10px;color:#fff}
.cs-info .cs-title{background:linear-gradient(135deg,#5c6bc0,#3f51b5)}
.cs-monthly .cs-title{background:linear-gradient(135deg,#42a5f5,#1e88e5)}
.cs-score .cs-title{background:linear-gradient(135deg,#ab47bc,#7b1fa2)}
.compare-table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:auto}
.compare-table th{background:#f8f8f8;padding:6px;text-align:center;font-weight:600;color:var(--text);border-bottom:1px solid #e0e0e0;white-space:nowrap;font-size:.72rem}
.compare-table td{padding:5px 6px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:.78rem}
.compare-table td:first-child{text-align:left;font-weight:500;background:#fafafa;white-space:nowrap}
.compare-table .best-cell{background:rgba(76,175,80,.1)!important;color:#2e7d32;font-weight:700}
.compare-table .verdict{font-size:.82rem;font-weight:700;color:var(--text);text-align:center;padding:10px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;margin-top:10px}

/* Proposal */
.proposal{display:none;background:#fff;padding:24px;border-radius:var(--r);box-shadow:var(--shadow)}
.proposal.show{display:block}
.proposal-header{text-align:center;border-bottom:3px double var(--accent);padding-bottom:12px;margin-bottom:16px}
.proposal-header h2{font-size:1.2rem;color:var(--accent);margin-bottom:4px}
.proposal-header p{font-size:.8rem;color:var(--muted)}
.proposal-car{font-size:1.1rem;font-weight:700;color:var(--accent2);text-align:center;margin:12px 0;padding:10px;background:linear-gradient(135deg,var(--p4),var(--p3));border-radius:8px}
.proposal-section{margin-bottom:14px}
.proposal-section h4{font-size:.85rem;color:var(--accent);margin-bottom:6px;border-bottom:1px solid #e0e0e0;padding-bottom:4px}
.proposal-row{display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;border-bottom:1px dotted #eee}
.proposal-row .label{color:var(--muted)}
.proposal-row .value{font-weight:600;color:var(--text)}
.proposal-freebies{display:flex;flex-wrap:wrap;gap:6px}
.proposal-freebies .tag{background:var(--p4);color:var(--accent2);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500}
.proposal-rec{background:linear-gradient(135deg,var(--p5),#fff);border:2px solid var(--accent);border-radius:8px;padding:12px;margin:12px 0}
.proposal-rec h4{color:var(--accent);margin-bottom:6px;font-size:.9rem}
.proposal-footer{text-align:center;font-size:.72rem;color:var(--muted);border-top:1px solid #e0e0e0;padding-top:10px;margin-top:16px}
.proposal-actions{display:flex;gap:8px;margin-top:12px}
.proposal-actions .btn{flex:1}
.btn-print{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-back{background:#f5f5f5;color:var(--muted);border:2px solid #e0e0e0}

/* Freebies tag */
.freebies-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.freebies-tags .tag{background:var(--p4);color:var(--accent2);padding:2px 8px;border-radius:12px;font-size:.7rem}

@media print{
  body{background:#fff!important}
  .container{max-width:100%;padding:0}
  .tabs,.form-panel,.history,.result-panel,.proposal-actions,.btn-back,.btn-print{display:none!important}
  .proposal{display:block!important;box-shadow:none;padding:12px}
  .proposal .no-print{display:none!important}
  .compare-page{display:block!important}
  .compare-select{display:none!important}
  .compare-result{box-shadow:none;padding:0}
  .compare-section{break-inside:avoid}
  .cs-title{color:#333!important;background:#e0e0e0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:360px){.container{padding:8px}.card{padding:10px}.tab-btn{padding:8px 16px;font-size:.82rem}}
</style>
</head>
<body>
<div class="container">
  <h1>🏦 คำนวณดอกเบี้ย</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('car')">🚗 รถยนต์</button>
    <button class="tab-btn" onclick="switchTab('home')">🏠 บ้าน</button>
    <button class="tab-btn" onclick="switchTab('compare')">📊 เปรียบเทียบ</button>
  </div>

  <div class="main-layout" id="main-layout">
    <!-- Form Panel -->
    <div class="form-panel">
      <!-- Car Loan -->
      <div id="car-form" class="card">
        <div class="field">
          <label>ชื่อรถ / รุ่น (ไม่บังคับ)</label>
          <input type="text" id="car-name" placeholder="เช่น Honda City 2024">
        </div>
        <div class="field">
          <label>ราคารถ (บาท)</label>
          <input type="text" id="car-price" placeholder="เช่น 800,000" inputmode="numeric" oninput="syncDown('car','pct')">
        </div>
        <div class="field">
          <label>ส่วนลด (บาท)</label>
          <div class="discount-row">
            <div class="field down-input" style="margin-bottom:0">
              <input type="text" id="car-discount" inputmode="numeric" placeholder="0" oninput="syncDiscount()">
              <span class="down-suffix">฿</span>
            </div>
            <div class="discount-toggle-row" onclick="this.querySelector('input').click()">
              <span class="toggle"><input type="checkbox" id="car-discount-down"><span class="slider"></span></span>
              <span class="discount-toggle-label">หักดาวน์</span>
            </div>
          </div>
        </div>
        <div class="field">
          <label>เงินดาวน์</label>
          <div class="down-dual">
            <div class="field down-input">
              <input type="number" id="car-down-pct" value="25" min="0" max="100" oninput="syncDown('car','pct')">
              <span class="down-suffix">%</span>
            </div>
            <div class="down-arrow">⇄</div>
            <div class="field down-input">
              <input type="text" id="car-down-amt" inputmode="numeric" oninput="syncDown('car','amt')">
              <span class="down-suffix">฿</span>
            </div>
          </div>
          <div id="discount-status" class="discount-status" style="display:none"></div>
        </div>
        <div class="field">
          <label>ดอกเบี้ย (% ต่อปี) — แยกตามงวด</label>
          <div class="rate-grid">
            <div class="rate-item"><label>48 ด.</label><input type="number" id="rate48" step="0.1" placeholder="%" oninput="rateChanged(48)"><input type="text" class="rate-monthly" id="pv48" inputmode="numeric" placeholder="฿/ด."></div>
            <div class="rate-item"><label>60 ด.</label><input type="number" id="rate60" step="0.1" placeholder="%" oninput="rateChanged(60)"><input type="text" class="rate-monthly" id="pv60" inputmode="numeric" placeholder="฿/ด."></div>
            <div class="rate-item"><label>72 ด.</label><input type="number" id="rate72" step="0.1" placeholder="%" oninput="rateChanged(72)"><input type="text" class="rate-monthly" id="pv72" inputmode="numeric" placeholder="฿/ด."></div>
            <div class="rate-item"><label>84 ด.</label><input type="number" id="rate84" step="0.1" placeholder="%" oninput="rateChanged(84)"><input type="text" class="rate-monthly" id="pv84" inputmode="numeric" placeholder="฿/ด."></div>
          </div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:3px">กรอกเฉพาะงวดที่ต้องการ</div>
        </div>
        <div class="field">
          <label>วิธีคิด</label>
          <div class="radio-group">
            <label><input type="radio" name="car-method" value="flat" checked><span>Flat Rate</span></label>
            <label><input type="radio" name="car-method" value="effective"><span>Effective Rate</span></label>
          </div>
        </div>
        <button class="btn btn-secondary" onclick="openFreebiesModal()">🎁 เลือกของแถม</button>
        <div id="freebies-preview" class="freebies-tags" style="margin-top:6px"></div>
        <div class="btn-row">
          <button class="btn btn-calc" id="car-calc-btn" onclick="calcCar()">🔢 คำนวณ</button>
          <button class="btn btn-secondary" onclick="clearCarForm()" style="margin-top:0">🗑️ ล้างค่า</button>
        </div>
      </div>

      <!-- Home Loan -->

// --- Two-way sync: % ↔ monthly payment ---
let _syncing=false; // prevent loops

function getLoan(){
  const price=getVal('car-price');
  const discount=getVal('car-discount');
  const discountDown=document.getElementById('car-discount-down').checked;
  const downPct=parseFloat(document.getElementById('car-down-pct').value)||0;
  const downAmt=getVal('car-down-amt');
  if(!price)return 0;
  let loan;
  if(discountDown){
    const rawDown=downAmt>0?downAmt:price*downPct/100;
    const effectiveDown=Math.max(0,rawDown-discount);
    loan=price-effectiveDown;
  }else{
    const ep=Math.max(0,price-discount);
    const rawDown=downAmt>0?downAmt:ep*downPct/100;
    loan=ep-rawDown;
  }
  return Math.max(0,loan);
}

function calcMonthly(loan,ratePct,months,method){
  if(!loan||ratePct<0)return 0;
  if(method==='flat'){
    return (loan+loan*ratePct/100*(months/12))/months;
  }else{
    const r=ratePct/100/12;
    return r>0?loan*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1):loan/months;
  }
}

// Solve rate from monthly payment (binary search)
function solveRate(loan,monthly,months,method){
  if(!loan||monthly<=0)return 0;
  if(method==='flat'){
    const totalInterest=monthly*months-loan;
    const rate=totalInterest/(loan*(months/12))*100;
    return Math.max(0,rate);
  }
  // Effective: binary search on rate%
  let lo=0.001,hi=100;
  for(let i=0;i<50;i++){
    const mid=(lo+hi)/2;
    const m=calcMonthly(loan,mid,months,'effective');
    if(m<monthly)lo=mid;else hi=mid;
  }
  return (lo+hi)/2;
}

function rateChanged(months){
  if(_syncing)return;
  _syncing=true;
  const loan=getLoan();
  const method=document.querySelector('input[name="car-method"]:checked').value;
  const rate=+document.getElementById('rate'+months).value;
  const el=document.getElementById('pv'+months);
  if(loan<=0||rate<0){el.value='';_syncing=false;return}
  const monthly=calcMonthly(loan,rate,months,method);
  el.value=fmt(Math.round(monthly));
  _syncing=false;
}

function monthlyChanged(months){
  if(_syncing)return;
  _syncing=true;
  const price=getVal('car-price');
  const rate=+document.getElementById('rate'+months).value;
  const method=document.querySelector('input[name="car-method"]:checked').value;
  const monthlyVal=+(document.getElementById('pv'+months).value.replace(/[^0-9]/g,''));
  if(!price||monthlyVal<=0||rate<0){_syncing=false;return}

  // Solve for loan amount that gives this monthly payment
  let loan;
  if(method==='flat'){
    // monthly = (loan + loan*rate/100*(months/12)) / months
    // loan = monthly * months / (1 + rate/100 * months/12)
    const factor=1+rate/100*(months/12);
    loan=monthlyVal*months/factor;
  }else{
    // Effective: loan = monthly * ((1+r)^n - 1) / (r * (1+r)^n)
    const r=rate/100/12;
    if(r>0){
      const pow=Math.pow(1+r,months);
      loan=monthlyVal*(pow-1)/(r*pow);
    }else{
      loan=monthlyVal*months;
    }
  }

  // downPayment = price - loan
  let downPayment=Math.max(0,price-loan);
  const discount=getVal('car-discount');
  const discountDown=document.getElementById('car-discount-down').checked;
  // If discount is deducted from down, the user's actual down = downPayment - discount
  if(discountDown&&discount>0){
    downPayment=Math.max(0,downPayment-discount);
  }

  // Update down payment fields
  const pctEl=document.getElementById('car-down-pct');
  const amtEl=document.getElementById('car-down-amt');
  amtEl.value=fmt(Math.round(downPayment));
  if(price>0)pctEl.value=Math.round(downPayment/price*10000)/100;
  _syncing=false;
}

function livePreview(){
  if(_syncing)return;
  _syncing=true;
  const loan=getLoan();
  const method=document.querySelector('input[name="car-method"]:checked').value;
  [48,60,72,84].forEach(m=>{
    const rate=+document.getElementById('rate'+m).value;
    const el=document.getElementById('pv'+m);
    if(loan<=0||!rate||rate<=0){el.value='';return}
    const monthly=calcMonthly(loan,rate,m,method);
    el.value=fmt(Math.round(monthly));
  });
  _syncing=false;
}

function syncDown(type,source){
  const price=getVal(type==='car'?'car-price':'home-price');
  const discount=type==='car'?getVal('car-discount'):0;
  const discountDown=type==='car'&&document.getElementById('car-discount-down').checked;
  const pctEl=document.getElementById(type+'-down-pct');
  const amtEl=document.getElementById(type+'-down-amt');
  if(source==='pct'){
    const pct=parseFloat(pctEl.value)||0;
    if(price>0){
      let amt=price*pct/100;
      if(discountDown&&discount>0)amt=Math.max(0,amt-discount);
      amtEl.value=fmt(amt);
    }
  }else{
    const amt=getVal(type+'-down-amt');
    if(price>0){
      const effective=discountDown?amt+discount:amt;
      pctEl.value=Math.round(effective/price*10000)/100;
    }
  }
}

// --- Car calc ---
function calcCar(){
  const isEdit=editMode&&editMode.type==='car';
  let name=document.getElementById('car-name').value.trim();
  const price=getVal('car-price');
  const discount=getVal('car-discount');
  const discountDown=document.getElementById('car-discount-down').checked;
  const downPct=parseFloat(document.getElementById('car-down-pct').value)||0;
  const downAmt=getVal('car-down-amt');
  const method=document.querySelector('input[name="car-method"]:checked').value;
  if(!price){alert('กรุณากรอกราคารถ');return}
  // Auto-name if empty
  if(!name){
    const h=getHistory().filter(x=>x.type==='car');
    name='รถยนต์ '+(h.length+1);
  }

  let effectivePrice=price, effectiveDown, loan, actualPct;
  if(discountDown){
    effectivePrice=price;
    const rawDown=downAmt>0?downAmt:price*downPct/100;
    effectiveDown=Math.max(0,rawDown-discount);
    loan=price-effectiveDown;
    actualPct=price>0?Math.round(effectiveDown/price*10000)/100:0;
  }else{
    effectivePrice=Math.max(0,price-discount);
    const rawDown=downAmt>0?downAmt:effectivePrice*downPct/100;
    effectiveDown=rawDown;
    loan=effectivePrice-effectiveDown;
    actualPct=effectivePrice>0?Math.round(effectiveDown/effectivePrice*10000)/100:0;
  }

  const durations=[48,60,72,84];
  let results=[], filledCount=0;
  durations.forEach(m=>{
    const rateEl=document.getElementById('rate'+m);
    const rate=+rateEl.value;
    if(rate<0){rateEl.style.borderColor='#ef5350';return;}
    rateEl.style.borderColor='#e0e0e0';
    filledCount++;
    const years=m/12;
    let totalInterest,monthly,totalPayment;
    if(method==='flat'){
      totalInterest=loan*rate/100*years;
      monthly=(loan+totalInterest)/m;
      totalPayment=loan+totalInterest;
    }else{
      const r=rate/100/12;
      monthly=r>0?loan*r*Math.pow(1+r,m)/(Math.pow(1+r,m)-1):loan/m;
      totalPayment=monthly*m;
      totalInterest=totalPayment-loan;
    }
    results.push({months:m,rate,monthly,totalInterest,totalPayment});
  });

  if(!filledCount){alert('กรุณากรอกอัตราดอกเบี้ยอย่างน้อย 1 งวด');return}
  results.sort((a,b)=>a.totalInterest-b.totalInterest);
  const methodLabel=method==='flat'?'Flat Rate':'Effective Rate (ลดต้นลดดอก)';
  let info=`<div class="info">`;
  if(name)info+=`<b>${name}</b><br>`;
  info+=`ราคารถ <b>${fmt(price)}</b> บาท`;
  if(discount>0)info+=` | ส่วนลด ${fmt(discount)} บาท`;
  info+=`<br>ราคาสุทธิ <b>${fmt(effectivePrice)}</b> บาท | ดาวน์ ${actualPct}% = ${fmt(effectiveDown)} บาท<br>`;
  info+=`วงเงินกู้ <b>${fmt(loan)}</b> บาท | ${methodLabel}</div>`;

  let table=`<div class="result-wrap"><table class="result-table"><thead><tr>`
    +`<th>งวด</th><th>ดอกเบี้ย</th><th>ค่างวด/เดือน</th><th>ดอกเบี้ยรวม</th><th>จ่ายทั้งหมด</th>`
    +`</tr></thead><tbody>`;
  results.forEach((r,i)=>{
    const cls=i===0?' class="best"':'';
    table+=`<tr${cls}><td>${r.months} เดือน</td><td>${r.rate}%</td>`
      +`<td>${fmt(r.monthly)} บาท</td><td>${fmt(r.totalInterest)} บาท</td>`
      +`<td>${fmt(r.totalPayment)} บาท</td></tr>`;
  });
  if(results.length>1){
    const maxInt=Math.max(...results.map(r=>r.totalInterest));
    const minInt=Math.min(...results.map(r=>r.totalInterest));
    table+=`<tr><td colspan="3" style="text-align:center;color:var(--muted)">ผลต่างดอกเบี้ยสูงสุด-ต่ำสุด</td>`
      +`<td colspan="2" style="color:#ef5350;font-weight:700">${fmt(maxInt-minInt)} บาท</td></tr>`;
  }
  table+=`</tbody></table></div>`;

  // Proposal button
  table+=`<div style="text-align:center;margin-top:10px"><button class="btn btn-secondary" style="width:auto;display:inline-block" onclick="showProposal()">📄 ใบเสนอราคา</button><button class="btn-edit" onclick="editHistoryItem(currentViewIdx)">✏️ แก้ไข</button></div>`;

  document.getElementById('result-title').textContent='🚗 ผลลัพธ์สินเชื่อรถยนต์';
  document.getElementById('result-body').innerHTML=info+table;
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('main-layout').classList.add('calculated');
  syncPanelHeights();
  document.getElementById('result-panel').scrollIntoView({behavior:'smooth',block:'start'});
  const carData={type:'car',name:name||null,price,discount,discountDown,effectivePrice,downPct:actualPct,effectiveDown,loan,method,freebies:selectedFreebies.slice(),results:results.map(r=>({m:r.months,rate:r.rate,monthly:Math.round(r.monthly),interest:Math.round(r.totalInterest),total:Math.round(r.totalPayment)}))};
  if(isEdit){
    const h=getHistory();
    carData.date=h[editMode.idx].date;
    carData.id=h[editMode.idx].id;
    h[editMode.idx]=carData;
    setLS('calc_history',JSON.stringify(h));
    currentViewIdx=editMode.idx;
    renderHistory();
    setEditMode(null);
  }else{
    saveHistory(carData);
    currentViewIdx=0;
  }
}

function calcHome(){
  const isEdit=editMode&&editMode.type==='home';
  const price=getVal('home-price');
  const downPct=parseFloat(document.getElementById('home-down-pct').value)||0;
  const downAmt=getVal('home-down-amt');
  const years=+document.getElementById('home-term').value;
  const mrr=parseFloat(document.getElementById('home-mrr').value)||0;
  if(!price){alert('กรุณากรอกราคาบ้าน');return}
  if(!homeRatePeriods.length){alert('กรุณาเพิ่มอัตราดอกเบี้ยอย่างน้อย 1 ช่วง');return}

  let loan;
  const downAmtCalc=price*downPct/100;
  const actualDown=downAmt>0?downAmt:downAmtCalc;
  const actualPct=downAmt>0?(price>0?Math.round(downAmt/price*10000)/100:0):downPct;
  loan=price-actualDown;
  if(loan<=0){alert('วงเงินกู้ต้องมากกว่า 0');return}

  const totalMonths=years*12;
  // Build rate schedule: month → rate
  const monthRates=[];
  for(let i=0;i<totalMonths;i++){
    const month=i+1;
    let rate=0;
    for(const p of homeRatePeriods){
      if(month>=p.startMonth&&month<=p.endMonth){
        rate=p.type==='fixed'?p.value:Math.max(0,mrr+p.adjust);
        break;
      }
    }
    monthRates.push(rate);
  }

  // Amortization with variable rates (reducing balance)
  let balance=loan,schedule=[],totalInterest=0,totalPrincipal=0;
  for(let i=0;i<totalMonths;i++){
    const r=monthRates[i]/100/12;
    const remaining=totalMonths-i;
    // Calculate monthly payment for remaining term with current rate
    let payment;
    if(r>0){
      payment=balance*r*Math.pow(1+r,remaining)/(Math.pow(1+r,remaining)-1);
    }else{
      payment=balance/remaining;
    }
    const ip=balance*r;
    const pp=payment-ip;
    balance=Math.max(0,balance-pp);
    totalInterest+=ip;totalPrincipal+=pp;
    schedule.push({no:i+1,payment,principal:pp,interest:ip,balance,rate:monthRates[i]});
  }
  const totalPayment=totalPrincipal+totalInterest;

  const downLabel=`ดาวน์ ${actualPct}% = ${fmt(actualDown)} บาท`;
  let info=`<div class="info">`
    +`ราคาบ้าน <b>${fmt(price)}</b> บาท | ${downLabel}<br>`
    +`วงเงินกู้ <b>${fmt(loan)}</b> บาท | ${years} ปี (${totalMonths} งวด)<br>`
    +`ค่างวด/เดือน <b>${fmt(schedule[0].payment)}</b> บาท (งวดแรก)</div>`;

  let table=`<div class="amort-wrap"><table class="amort-table"><thead><tr>`
    +`<th>#</th><th>ค่างวด</th><th>เงินต้น</th><th>ดอกเบี้ย</th><th>%</th><th>คงเหลือ</th>`
    +`</tr></thead><tbody>`;
  schedule.forEach(s=>{
    table+=`<tr><td>${s.no}</td><td>${fmt(s.payment)}</td><td>${fmt(s.principal)}</td><td>${fmt(s.interest)}</td><td>${s.rate.toFixed(2)}</td><td>${fmt(s.balance)}</td></tr>`;
  });
  table+=`<tr class="row-total"><td>รวม</td><td>${fmt(totalPayment)}</td><td>${fmt(totalPrincipal)}</td><td>${fmt(totalInterest)}</td><td></td><td>0</td></tr>`;
  table+=`</tbody></table></div><div class="scroll-hint">↕ เลื่อนดูทุกงวด (${totalMonths} งวด)</div>`;

  document.getElementById('result-title').textContent='🏠 ผลลัพธ์สินเชื่อบ้าน';
  document.getElementById('result-body').innerHTML=info+table;
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('main-layout').classList.add('calculated');
  syncPanelHeights();
  document.getElementById('result-panel').scrollIntoView({behavior:'smooth',block:'start'});
  const customerType=document.querySelector('input[name="home-customer"]:checked')?.value||'retail';
  const homeData={type:'home',price,downPct:actualPct,mrr,years,customerType,ratePeriods:JSON.parse(JSON.stringify(homeRatePeriods)),results:[{m:totalMonths,monthly:Math.round(schedule[0].payment),interest:Math.round(totalInterest),total:Math.round(totalPayment)}]};
  if(isEdit){
    const h=getHistory();
    homeData.date=h[editMode.idx].date;
    homeData.id=h[editMode.idx].id;
    h[editMode.idx]=homeData;
    setLS('calc_history',JSON.stringify(h));
    currentViewIdx=editMode.idx;
    renderHistory();
    setEditMode(null);
  }else{
    saveHistory(homeData);
    currentViewIdx=0;
  }
}

function renderCompareList(){

  const el=document.getElementById('compare-list');
  const cars=all.map((item,i)=>({item,i})).filter(x=>x.item.type==='car');
  if(!cars.length){el.innerHTML='<div class="empty">ยังไม่มีประวัติรถยนต์</div>';return}
  el.innerHTML=cars.map(({item,i})=>{
    const nameText=item.name||`รถ ${fmt(item.price)} บาท`;
    return `<div class="compare-item"><input type="checkbox" id="cmp-${i}" value="${i}"><label for="cmp-${i}">🚗 ${nameText} (${item.date})</label></div>`;
  }).join('');

function runCompare(){
  const h=getHistory();
  const selected=[];
  document.querySelectorAll('#compare-list input[type="checkbox"]:checked').forEach(cb=>{
    const item=h[+cb.value];
    if(item&&item.type==='car')selected.push(item);
  });
  if(selected.length<2){alert('เลือกรายการอย่างน้อย 2 รายการ');return}

  const allMonths=[...new Set(selected.flatMap(s=>s.results.map(r=>r.m)))].sort((a,b)=>a-b);

  // Helper: find best value in array
  function bestOf(vals,lower){
    const nums=vals.filter(v=>v!==null&&v!==undefined&&!isNaN(v));
    if(!nums.length)return null;
    return lower?Math.min(...nums):Math.max(...nums);
  }
  function cell(v,best,fmt){
    const cls=(best!==null&&v===best)?' class="best-cell"':'';
    return `<td${cls}>${fmt(v)}</td>`;
  }

  let html=`<div class="compare-header">`;
  html+=`<h3>📊 ผลเปรียบเทียบ (${selected.length} คัน)</h3>`;
  html+=`<button class="btn btn-secondary" onclick="window.print()" style="width:auto;display:inline-block;font-size:.8rem;padding:6px 14px">🖨️ พิมพ์</button>`;
  html+=`</div>`;

  // === Section 1: ข้อมูลรถ ===
  html+=`<div class="compare-section cs-info">`;
  html+=`<div class="cs-title">🚗 ข้อมูลรถ</div>`;
  html+=`<div class="result-wrap"><table class="compare-table"><thead><tr><th></th>`;
  selected.forEach(s=>{html+=`<th>${(s.name||fmt(s.price)+'฿').substring(0,15)}</th>`});
  html+=`</tr></thead><tbody>`;
  const infoDims=[
    {label:'ราคารถ',fmt:v=>fmt(v)+'฿',get:s=>s.price},
    {label:'ส่วนลด',fmt:v=>v?fmt(v)+'฿':'-',get:s=>s.discount||0},
    {label:'เงินดาวน์',fmt:v=>fmt(v)+'฿',get:s=>s.effectiveDown||0},
    {label:'วงเงินกู้',fmt:v=>fmt(v)+'฿',get:s=>s.loan||0},
  ];
  infoDims.forEach(d=>{
    const vals=selected.map(d.get);
    const b=bestOf(vals,false);
    html+=`<tr><td>${d.label}</td>`;
    selected.forEach((s,i)=>{html+=cell(vals[i],b,d.fmt)});
    html+=`</tr>`;
  });
  html+=`</tbody></table></div></div>`;

  // === Section 2: ค่างวดแต่ละงวด ===
  allMonths.forEach(m=>{
    html+=`<div class="compare-section cs-monthly">`;
    html+=`<div class="cs-title">📅 ผ่อน ${m} เดือน</div>`;
    html+=`<div class="result-wrap"><table class="compare-table"><thead><tr><th></th>`;
    selected.forEach(s=>{html+=`<th>${(s.name||fmt(s.price)+'฿').substring(0,15)}</th>`});
    html+=`</tr></thead><tbody>`;
    const monthDims=[
      {label:'ค่างวด/ด.',fmt:v=>fmt(v)+'฿',get:s=>{const r=s.results.find(x=>x.m===m);return r?r.monthly:null},lower:true},
      {label:'ดอกเบี้ยรวม',fmt:v=>fmt(v)+'฿',get:s=>{const r=s.results.find(x=>x.m===m);return r?r.interest:null},lower:true},
      {label:'จ่ายทั้งหมด',fmt:v=>fmt(v)+'฿',get:s=>{const r=s.results.find(x=>x.m===m);return r?r.total:null},lower:true},
      {label:'ดอกเบี้ยจริง',fmt:v=>v!==null?v.toFixed(2)+'%':'-',get:s=>{const r=s.results.find(x=>x.m===m);return r&&s.loan?r.interest/s.loan/(m/12)*100:null},lower:true},
    ];
    monthDims.forEach(d=>{
      const vals=selected.map(d.get);
      const b=bestOf(vals,d.lower);
      html+=`<tr><td>${d.label}</td>`;
      selected.forEach((s,i)=>{html+=cell(vals[i],b,d.fmt)});
      html+=`</tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });

  // === Section 3: สรุปคะแนน ===
  html+=`<div class="compare-section cs-score">`;
  html+=`<div class="cs-title">⭐ สรุปคะแนน</div>`;
  const scored=selected.map((s,i)=>{
    const best=s.results[0];
    const effRate=s.loan?best.interest/s.loan/(best.m/12)*100:99;
    const intRatio=s.loan?best.interest/s.loan*100:99;
    const score=effRate*0.5+intRatio*0.3+(best.m/12)*0.2;
    return{idx:i,name:s.name||fmt(s.price)+'฿',score,effRate,intRatio,totalInterest:best.interest};
  });
  // Find winner (lowest score) — keep original order for table
  const winner=[...scored].sort((a,b)=>a.score-b.score)[0];
  html+=`<div class="verdict">🏆 แนะนำ: <b>${winner.name}</b> — ดอกเบี้ยจริง ${winner.effRate.toFixed(2)}%, สัดส่วนดอกเบี้ย ${winner.intRatio.toFixed(1)}%, ดอกเบี้ยรวม ${fmt(winner.totalInterest)} บาท</div>`;
  html+=`<div class="result-wrap"><table class="compare-table"><thead><tr><th></th>`;
  selected.forEach(s=>{html+=`<th>${(s.name||fmt(s.price)+'฿').substring(0,15)}</th>`});
  html+=`</tr></thead><tbody>`;
  // Render in selected order (not sorted)
  html+=`<tr><td>ดอกเบี้ยจริง</td>`;
  scored.forEach(s=>{html+=`<td>${s.effRate.toFixed(2)}%</td>`});
  html+=`</tr><tr><td>สัดส่วนดอกเบี้ย</td>`;
  scored.forEach(s=>{html+=`<td>${s.intRatio.toFixed(1)}%</td>`});
  html+=`</tr><tr><td>ดอกเบี้ยรวม</td>`;
  scored.forEach(s=>{html+=`<td>${fmt(s.totalInterest)}฿</td>`});
  html+=`</tr><tr><td>⭐ คะแนน</td>`;
  const scoreBest=Math.min(...scored.map(s=>s.score));
  scored.forEach(s=>{
    const cls=s.score===scoreBest?' class="best-cell"':'';
    html+=`<td${cls}>${s.score.toFixed(1)}</td>`;
  });
  html+=`</tr></tbody></table></div></div>`;

  const el=document.getElementById('compare-result');
  el.innerHTML=html;
  el.style.display='block';
}

// --- Proposal ---
function showProposal(){showProposalFromHistory(0)}
function showProposalFromHistory(idx){
  const h=getHistory();if(!h[idx])return;
  const item=h[idx];
  if(item.type!=='car'){alert('ใบเสนอราคารองรับเฉพาะรถยนต์');return}
  const el=document.getElementById('proposal-page');
  const today=new Date().toLocaleString('th-TH',{dateStyle:'long'});
  const best=item.results[0];
  const freebiesHtml=item.freebies&&item.freebies.length?item.freebies.map(f=>`<span class="tag">${f}</span>`).join(''):'<span style="color:var(--muted)">-</span>';

  let html=`
    <div class="proposal-header">
      <h2>📄 ใบเสนอราคาสินเชื่อรถยนต์</h2>
      <p>วันที่ ${today}</p>
    </div>
    <div class="proposal-car">${item.name||'รถยนต์'}</div>
    <div class="proposal-section">
      <h4>สรุปรายการ</h4>
      <div class="proposal-row"><span class="label">ราคารถ</span><span class="value">${fmt(item.price)} บาท</span></div>
      ${item.discount?`<div class="proposal-row"><span class="label">ส่วนลด</span><span class="value" style="color:#ef5350">-${fmt(item.discount)} บาท</span></div>`:''}
      <div class="proposal-row"><span class="label">ราคาสุทธิ</span><span class="value">${fmt(item.effectivePrice||item.price)} บาท</span></div>
      <div class="proposal-row"><span class="label">เงินดาวน์ (${item.downPct}%)</span><span class="value">${fmt(item.effectiveDown||(item.effectivePrice||item.price)*item.downPct/100)} บาท</span></div>
      <div class="proposal-row"><span class="label">วงเงินกู้</span><span class="value">${fmt(item.loan||(item.effectivePrice||item.price)-(item.effectiveDown||(item.effectivePrice||item.price)*item.downPct/100))} บาท</span></div>
      <div class="proposal-row"><span class="label">วิธีคิดดอกเบี้ย</span><span class="value">${item.method==='flat'?'Flat Rate':'Effective Rate'}</span></div>
    </div>
    <div class="proposal-section">
      <h4>ของแถม</h4>
      <div class="proposal-freebies">${freebiesHtml}</div>
    </div>
    <div class="proposal-rec">
      <h4>🌟 แนะนำ — ผ่อน ${best.m} เดือน</h4>
      <div class="proposal-row"><span class="label">ค่างวด/เดือน</span><span class="value" style="color:var(--accent);font-size:1.1rem">${fmt(best.monthly)} บาท</span></div>
      <div class="proposal-row"><span class="label">ดอกเบี้ยรวม</span><span class="value">${fmt(best.interest)} บาท</span></div>
      <div class="proposal-row"><span class="label">จ่ายทั้งหมด</span><span class="value">${fmt(best.total)} บาท</span></div>
    </div>
    <div class="proposal-section">
      <h4>ตารางเปรียบเทียบทุกงวด</h4>
      <div class="result-wrap"><table class="result-table" style="min-width:auto"><thead><tr>
        <th>งวด</th><th>ดอกเบี้ย</th><th>ค่างวด/เดือน</th><th>ดอกเบี้ยรวม</th><th>จ่ายทั้งหมด</th>
      </tr></thead><tbody>`;
  item.results.forEach((r,i)=>{
    const cls=i===0?' class="best"':'';
    html+=`<tr${cls}><td>${r.m} เดือน</td><td>${r.rate}%</td><td>${fmt(r.monthly)} บาท</td><td>${fmt(r.interest)} บาท</td><td>${fmt(r.total)} บาท</td></tr>`;
  });
  html+=`</tbody></table></div></div>
    <div class="proposal-footer">ใบเสนอนี้มีอายุ 7 วัน นับจากวันที่ออกใบเสนอ | ราคาอาจเปลี่ยนแปลงตามนโยบายบริษัท</div>
    <div class="proposal-actions no-print">
      <button class="btn btn-print" onclick="window.print()">🖨️ พิมพ์</button>
      <button class="btn btn-back" onclick="closeProposal()">← กลับ</button>
    </div>`;

  el.innerHTML=html;
  el.style.display='block';
  el.classList.add('show');
  document.querySelector('.form-panel').style.display='none';
  document.querySelector('.result-panel').style.display='none';
  document.getElementById('compare-page').style.display='none';
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeProposal(){
  document.getElementById('proposal-page').style.display='none';
  document.getElementById('proposal-page').classList.remove('show');
  document.querySelector('.form-panel').style.display='';
  document.querySelector('.result-panel').style.display='';
  syncPanelHeights();
}
</script>
